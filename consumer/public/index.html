<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Product Loader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }

    pre {
      margin-top: 20px;
      background: #f4f4f4;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Product Loader</h1>

  <button onclick="loadData()">Load Products</button>

  <pre id="output">Click the button to load data.</pre>

  <script>
    function loadData() {
      fetch("http://localhost:3000/file-generated")
        .then(response => response.json())
        .then(data => {
          document.getElementById('output').textContent =
            JSON.stringify(data, null, 2);
        })
        .catch(error => {
          document.getElementById('output').textContent =
            'Error loading data: ' + error.message;
        });
    }
  </script>
</body>
</html>
